<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITB Analyzer & Technical Procedure Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: #f1f5f9; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }
    #doc-preview { background: #ffffff; color: #1e293b; font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.55; }
    #doc-preview h1 { font-size: 16pt; font-weight: 700; color: #0f172a; border-bottom: 2px solid #0284c7; padding-bottom: 6px; margin: 8px 0 12px; }
    #doc-preview h2 { font-size: 13pt; font-weight: 700; color: #0369a1; margin: 16px 0 8px; }
    #doc-preview h3 { font-size: 11.5pt; font-weight: 700; color: #0f172a; background: #f1f5f9; border-left: 3px solid #0284c7; padding: 4px 8px; margin: 12px 0 6px; }
    #doc-preview h4 { font-size: 11pt; font-weight: 700; color: #334155; margin: 10px 0 4px; }
    #doc-preview p { margin: 6px 0; }
    #doc-preview ul { list-style: disc; margin: 6px 0 10px 22px; }
    #doc-preview ol { list-style: decimal; margin: 6px 0 10px 22px; }
    #doc-preview li { margin-bottom: 4px; }
    #doc-preview table { width: 100%; border-collapse: collapse; margin: 10px 0 14px; font-size: 10pt; }
    #doc-preview th { background: #e2e8f0; color: #0f172a; font-weight: 700; border: 1px solid #94a3b8; padding: 6px 8px; text-align: left; }
    #doc-preview td { border: 1px solid #cbd5e1; padding: 6px 8px; vertical-align: top; }
    .tag-tbd { background: #fef3c7; color: #b45309; font-weight: 700; padding: 1px 4px; border-radius: 3px; border: 1px solid #f59e0b; }
    .tag-h { background: #fee2e2; color: #b91c1c; font-weight: 700; padding: 1px 4px; border-radius: 3px; }
    .tag-w { background: #e0f2fe; color: #0369a1; font-weight: 700; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
